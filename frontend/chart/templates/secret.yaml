# frontend/chart/templates/secret.yaml

---
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.service.name }}
  labels:
    app.kubernetes.io/app: {{ .Values.app }}
    app.kubernetes.io/component: {{ .Values.service.name }}
type: Opaque
stringData:
  BACKEND_URL: {{ .Values.backend.url | quote }}
  FRONTEND_PORT: {{ .Values.service.port | quote }}
