---
advisories:
  - vulnerability: CVE-2025-60876
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    impact_statement: The BusyBox wget applet is included in the Alpine operating system, but this service does not use it.
    products:
      - pkg:apk/alpine/busybox@1.37.0-r31
      - pkg:apk/alpine/busybox-binsh@1.37.0-r31
      - pkg:apk/alpine/ssl_client@1.37.0-r31

  - vulnerability: CVE-2026-85091
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    impact_statement: The zlib overflow requires gzprintf() or gzvprintf() on a non-blocking gzwrite() handle. This service does not call these functions or load libz directly.
    products:
      - pkg:apk/alpine/zlib@1.3.2-r0
