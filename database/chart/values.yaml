# database/chart/values.yaml

---
app: kaiju
namespace: kaiju
replicaCount: 1
image:
  pullPolicy: Always
  repository: kaiju/database
  tag: latest
service:
  type: ClusterIP
  name: database
  port: 5432
database:
  name: "###ZARF_VAR_PGDATABASE###"
  user: "###ZARF_VAR_PGUSER###"
  password: "###ZARF_VAR_PGPASSWORD###"
storage:
  path: /var/lib/postgresql
  size: 5Gi
