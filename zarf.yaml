# Kaiju application package included in the UDS Bundle.

---
apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: kaiju
  description: Kaiju application services and UDS Operator configuration
  version: 0.1.0
  annotations:
    dev.uds.title: Kaiju

variables:
  - name: FRONTEND_PORT
    default: "5173"
    sensitive: false
    description: Frontend service port
  - name: BACKEND_URL
    default: http://backend:8000
    sensitive: false
    description: Backend URL used by the frontend reverse proxy

components:
  - name: database
    required: true
    charts:
      - name: database
        version: 0.1.0
        namespace: kaiju
        localPath: database/chart
        valuesFiles:
          - database/chart/values.yaml
    images:
      - kaiju/database:latest
  - name: backend
    required: true
    charts:
      - name: backend
        version: 0.1.0
        namespace: kaiju
        localPath: backend/chart
        valuesFiles:
          - backend/chart/values.yaml
    images:
      - kaiju/backend:latest
  - name: frontend
    required: true
    charts:
      - name: frontend
        version: 0.1.0
        namespace: kaiju
        localPath: frontend/chart
        valuesFiles:
          - frontend/chart/values.yaml
    images:
      - kaiju/frontend:latest
  - name: uds-configuration
    required: true
    manifests:
      - name: uds-package
        namespace: kaiju
        files:
          - uds-package.yaml
