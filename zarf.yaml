# zarf.yaml

---
kind: ZarfPackageConfig
metadata:
  name: kaiju
  version: 0.1.0
  annotations:
    dev.uds.title: Kaiju

components:
  - name: database
    required: true
    charts:
      - name: database
        version: 0.1.0
        namespace: kaiju
        localPath: charts/database
        valuesFiles:
          - charts/database/values.yaml
    images:
      - kaiju/database:latest
  - name: backend
    required: true
    charts:
      - name: backend
        version: 0.1.0
        namespace: kaiju
        localPath: charts/backend
        valuesFiles:
          - charts/backend/values.yaml
    images:
      - kaiju/backend:latest
  - name: uds
    required: true
    manifests:
      - name: kaiju
        namespace: kaiju
        files:
          - uds-package.yaml
