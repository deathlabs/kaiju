# zarf.yaml

---
kind: ZarfPackageConfig
metadata:
  name: kaiju
  version: 0.1.0
  annotations:
    dev.uds.title: Kaiju

components:
  - name: database
    required: true
    charts:
      - name: database
        version: 0.1.0
        namespace: kaiju
        localPath: database/chart
        valuesFiles:
          - database/chart/values.yaml
    images:
      - kaiju/database:latest
  - name: backend
    required: true
    charts:
      - name: backend
        version: 0.1.0
        namespace: kaiju
        localPath: backend/chart
        valuesFiles:
          - backend/chart/values.yaml
    images:
      - kaiju/backend:latest
  - name: uds
    required: true
    manifests:
      - name: kaiju
        namespace: kaiju
        files:
          - uds-package.yaml
