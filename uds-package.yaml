# uds-package.yaml

---
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  namespace: kaiju
  name: kaiju
spec:
  network:
    expose:
      - service: backend
        podLabels:
          app.kubernetes.io/component: backend
        host: kaiju
        port: 8000
    allow:
      - description: Backend to database
        direction: Egress
        selector:
          app.kubernetes.io/component: backend
        remoteNamespace: kaiju
        remoteSelector:
          app.kubernetes.io/component: database
        port: 5432
      - description: Database from backend
        direction: Ingress
        selector:
          app.kubernetes.io/component: database
        remoteNamespace: kaiju
        remoteSelector:
          app.kubernetes.io/component: backend
        port: 5432
