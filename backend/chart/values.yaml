# backend/chart/values.yaml

---
app: kaiju
namespace: kaiju
replicaCount: 1
image: 
  pullPolicy: Always
  repository: kaiju/backend
  tag: latest
service: 
  type: ClusterIP
  name: backend
  port: 8000
telemetry:
  endpoint: http://jaeger.jaeger.svc.cluster.local:4317
  protocol: grpc
  serviceName: kaiju
auth:
  mode: oidc
  issuer: "###ZARF_VAR_OIDC_ISSUER###"
  audience: "###ZARF_VAR_OIDC_AUDIENCE###"
  jwksUrl: "###ZARF_VAR_OIDC_JWKS_URL###"
database:
  engine: postgres
  host: "###ZARF_VAR_PGHOST###"
  port: 5432
  sslmode: disable
  secret_key: kaiju
  name: "###ZARF_VAR_PGDATABASE###"
  user: "###ZARF_VAR_PGUSER###"
  password: "###ZARF_VAR_PGPASSWORD###"
