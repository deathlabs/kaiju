# backend/chart/templates/secret.yaml

---
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.service.name }}
  labels:
    app.kubernetes.io/app: {{ .Values.app }}
    app.kubernetes.io/component: {{ .Values.service.name }}
type: Opaque
stringData:
  DB_ENGINE: {{ .Values.database.engine | quote }}
  PGHOST: {{ .Values.database.host | quote }}
  PGDATABASE: {{ .Values.database.name | quote }}
  PGPORT: {{ .Values.database.port | quote }}
  PGSSLMODE: {{ .Values.database.sslmode | quote }}
  PGUSER: {{ .Values.database.user | quote }}
  PGPASSWORD: {{ .Values.database.password | quote }}
  SECRET_KEY: {{ .Values.database.secret_key | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.endpoint | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.telemetry.protocol | quote }}
  OTEL_LOGS_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_SERVICE_NAME: {{ .Values.telemetry.serviceName | quote }}
  OTEL_TRACES_EXPORTER: "otlp"
  
